spring.application.name=panaderialosandes
spring.thymeleaf.prefix=classpath:/templates/
# en la nube (Render) el puerto lo asigna la plataforma mediante la variable PORT
server.port=${PORT:8081}
# detras del proxy HTTPS de Render: usar el esquema y dominio publicos (X-Forwarded-*) al armar URLs, p. ej. el QR
server.forward-headers-strategy=framework
# menos hilos y conexiones para consumir poca memoria en el plan gratuito
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:30}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

#Configuracion de la base de datos
spring.config.import = optional:file:.env[.properties]

#se va proteger los datos de la base con variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

#Configuracion de JPA (el dialecto de MySQL se detecta automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

#Configuracion de Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Usuario administrador inicial: se crea solo si la tabla de usuarios esta vacia
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
# firma de la cookie "Recordarme" del login (opcional; conviene cambiarla en la nube)
app.seguridad.recordarme-clave=${RECORDARME_CLAVE:panaderia-los-andes-recordarme}

# Asistente de IA (gratuito). Proveedor: groq, gemini o auto (Groq si tiene clave; si no, Gemini).
# Sin ninguna API key el sistema funciona y el asistente queda deshabilitado
app.ia.proveedor=${IA_PROVEEDOR:auto}
# Groq: https://console.groq.com
app.ia.groq.api-key=${GROQ_API_KEY:}
app.ia.groq.modelo=${GROQ_MODEL:openai/gpt-oss-120b}
app.ia.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
# Google Gemini: https://aistudio.google.com
app.ia.gemini.api-key=${GEMINI_API_KEY:}
app.ia.gemini.modelo=${GEMINI_MODEL:gemini-flash-latest}
# nivel de razonamiento de Gemini: MINIMAL, LOW (por defecto, mas rapido), MEDIUM o HIGH
app.ia.gemini.razonamiento=${GEMINI_THINKING:LOW}
app.ia.gemini.base-url=${GEMINI_BASE_URL:}

# IoT: el sistema se suscribe a los topicos MQTT que publica el ESP32 (<base>/telemetria, /alertas, /estado)
app.iot.mqtt.habilitado=${MQTT_HABILITADO:true}
app.iot.mqtt.servidor=${MQTT_SERVIDOR:tcp://broker.hivemq.com:1883}
app.iot.mqtt.topico-base=${MQTT_TOPICO_BASE:losandes/utpgrupo03}
app.iot.mqtt.usuario=${MQTT_USUARIO:}
app.iot.mqtt.clave=${MQTT_CLAVE:}
# entrada HTTP alternativa: clave que debe enviarse en la cabecera X-API-KEY (sin ella queda deshabilitada)
app.iot.api-key=${IOT_API_KEY:}
# las lecturas se guardan como maximo cada N segundos y se conservan N dias
app.iot.segundos-entre-guardados=${IOT_SEGUNDOS_ENTRE_GUARDADOS:30}
app.iot.dias-retencion=${IOT_DIAS_RETENCION:30}

# Automatizaciones (Avance 4): los avisos se envian por webhook a la plataforma No-Code (Make)
app.automatizacion.webhook-url=${AUTOMATIZACION_WEBHOOK_URL:}
# clave que debe enviar GitHub Actions en la cabecera X-API-KEY para ejecutar las tareas programadas
app.automatizacion.api-key=${AUTOMATIZACION_API_KEY:}


logging.level.org.springframework.boot.context.config=DEBUG

spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=require