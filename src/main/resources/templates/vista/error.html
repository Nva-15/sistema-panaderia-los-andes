<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error · Panadería Los Andes</title>
    <th:block th:replace="~{componentes/head :: recursos}"></th:block>
</head>
<body>
    <div class="pantalla-simple">
        <div class="tarjeta text-center" style="max-width:480px">
            <div class="tarjeta-cuerpo p-4">
                <div class="marca-logo"><i class="fas fa-bread-slice"></i></div>
                <h1 class="h3 fw-bold" style="color:var(--cafe-oscuro)">¡Ups! Algo salió mal</h1>
                <p class="leyenda mb-4">Ocurrió un problema inesperado. Vuelve a intentarlo y, si el problema persiste, avisa al administrador.</p>
                <a th:href="@{/principal/inicio}" class="btn btn-marca"><i class="fas fa-house me-2"></i>Volver al inicio</a>
            </div>
        </div>
    </div>
</body>
</html>
