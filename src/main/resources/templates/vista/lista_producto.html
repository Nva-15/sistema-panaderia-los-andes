<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos · Panadería Los Andes</title>
    <th:block th:replace="~{componentes/head :: recursos}"></th:block>
</head>
<body>
    <div th:replace="~{componentes/header :: miCabecera}"></div>

    <main class="contenido">
        <div class="encabezado">
            <div>
                <h1>Productos</h1>
                <p>Precios y stock disponibles para la venta</p>
            </div>
            <a th:href="@{/productos/nuevo}" class="btn btn-marca" sec:authorize="hasRole('ADMIN')">
                <i class="fas fa-plus me-2"></i>Nuevo producto</a>
        </div>

        <div class="tarjeta">
            <div class="tarjeta-cuerpo d-flex flex-wrap gap-2 align-items-center">
                <!-- busqueda en el servidor por nombre -->
                <form th:action="@{/productos/buscar}" method="post" class="buscador flex-grow-1" style="max-width:360px">
                    <i class="fas fa-search"></i>
                    <input type="text" class="form-control" name="busqueda" th:value="${param.busqueda}" placeholder="Buscar por nombre...">
                </form>
                <!-- filtros en el navegador sobre la lista mostrada -->
                <select id="filtroCategoria" class="form-select" style="width:auto">
                    <option value="">Todas las categorías</option>
                    <option th:each="c : ${#lists.sort(#lists.toList(#sets.toSet(productos.![categoria_id.nombre])))}" th:value="${c}" th:text="${c}"></option>
                </select>
                <div class="segmentos" id="filtroCondicion">
                    <button type="button" class="activo" data-condicion="">Todos</button>
                    <button type="button" data-condicion="disponible">Disponibles</button>
                    <button type="button" data-condicion="bajo">Stock bajo</button>
                    <button type="button" data-condicion="agotado">Agotados</button>
                </div>
                <a th:if="${param.busqueda != null}" th:href="@{/principal/productos}" class="enlace-marca small ms-auto">Quitar búsqueda</a>
            </div>

            <div class="table-responsive">
                <table class="tabla">
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Stock</th>
                            <th class="text-end">Precio</th>
                            <th>Unidad</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductos">
                        <tr th:each="producto : ${productos}"
                            th:with="condicion=${producto.cantidad <= 0} ? 'agotado' : (${producto.cantidad <= 10} ? 'bajo' : 'disponible')"
                            th:attr="data-categoria=${producto.categoria_id?.nombre},data-condicion=${condicion}">
                            <td class="leyenda" th:text="${producto.id}"></td>
                            <td>
                                <strong th:text="${producto.nombre}"></strong>
                                <span class="estado e-neutro ms-1" th:if="${producto.estado == 'inactivo'}">Inactivo</span>
                            </td>
                            <td th:text="${producto.categoria_id?.nombre}"></td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="barra-stock"><span th:style="'width:' + ${producto.cantidad >= 50 ? 100 : (producto.cantidad <= 0 ? 0 : producto.cantidad * 2)} + '%;background:' + ${condicion == 'agotado' ? 'var(--peligro)' : (condicion == 'bajo' ? 'var(--trigo)' : 'var(--exito)')}"></span></div>
                                    <span class="estado" th:classappend="${condicion == 'agotado'} ? 'e-peligro' : (${condicion == 'bajo'} ? 'e-aviso' : 'e-exito')"
                                        th:text="${condicion == 'agotado'} ? 'Agotado' : ${producto.cantidad}"></span>
                                </div>
                            </td>
                            <td class="text-end fw-bold" th:text="${'S/ ' + #numbers.formatDecimal(producto.precio, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${producto.unidad}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="vacio" id="sinResultados" th:classappend="${#lists.isEmpty(productos)} ? '' : 'd-none'">
                <i class="fas fa-bread-slice"></i>No hay productos que coincidan</div>
            <div class="pie-tabla"><span id="contadorProductos" th:text="${#lists.size(productos) + ' productos'}"></span></div>
        </div>
    </main>

    <script>
        (function () {
            const filas = Array.from(document.querySelectorAll('#tablaProductos tr'));
            const categoria = document.getElementById('filtroCategoria');
            const botones = document.querySelectorAll('#filtroCondicion button');
            let condicion = '';

            function aplicar() {
                let visibles = 0;
                filas.forEach(f => {
                    const ok = (!categoria.value || f.dataset.categoria === categoria.value)
                        && (!condicion || f.dataset.condicion === condicion);
                    f.style.display = ok ? '' : 'none';
                    if (ok) visibles++;
                });
                document.getElementById('contadorProductos').textContent = visibles + ' de ' + filas.length + ' productos';
                document.getElementById('sinResultados').classList.toggle('d-none', visibles > 0);
            }

            categoria.addEventListener('change', aplicar);
            botones.forEach(b => b.addEventListener('click', () => {
                botones.forEach(x => x.classList.remove('activo'));
                b.classList.add('activo');
                condicion = b.dataset.condicion;
                aplicar();
            }));
        })();
    </script>
</body>
</html>
