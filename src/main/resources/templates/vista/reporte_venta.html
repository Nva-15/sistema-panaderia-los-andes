<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de ventas · Panadería Los Andes</title>
    <th:block th:replace="~{componentes/head :: recursos}"></th:block>
    <style>
        #tablaResultados tr.table-active td { background: var(--beige); color: var(--cafe-oscuro); font-size: 1rem; }
    </style>
</head>

<body>
    <div th:replace="~{componentes/header :: miCabecera}"></div>

    <main class="contenido">
        <div class="encabezado">
            <div>
                <h1>Reporte de ventas</h1>
                <p>Consulta lo vendido en un rango de fechas, por categoría o por vendedor</p>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="tarjeta mb-3">
            <div class="tarjeta-cabecera"><h2><i class="fas fa-sliders me-2"></i>Filtros</h2></div>
            <div class="tarjeta-cuerpo">
                <form id="reporteForm" class="report-form">
                    <div class="row g-3">
                        <div class="col-6 col-lg-2">
                            <label for="fechaDesde" class="form-label">Desde</label>
                            <input type="date" id="fechaDesde" class="form-control" required>
                        </div>
                        <div class="col-6 col-lg-2">
                            <label for="fechaHasta" class="form-label">Hasta</label>
                            <input type="date" id="fechaHasta" class="form-control" required>
                        </div>
                        <div class="col-12 col-sm-4 col-lg-2">
                            <label for="categoria" class="form-label">Categoría</label>
                            <select id="categoria" class="form-select">
                                <option value="">Todas</option>
                                <option value="1">Panes</option>
                                <option value="2">Tortas</option>
                                <option value="3">Pasteles</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-4 col-lg-2">
                            <label for="usuario" class="form-label">Usuario</label>
                            <select id="usuario" class="form-select">
                                <option value="">Todos</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-4 col-lg-2">
                            <label for="agruparPor" class="form-label">Agrupar por</label>
                            <select id="agruparPor" class="form-select">
                                <option value="">Ninguno</option>
                                <option value="categoria">Categoría</option>
                                <option value="usuario">Usuario</option>
                            </select>
                        </div>
                        <div class="col-12 col-lg-2 d-flex align-items-end gap-2">
                            <button type="button" class="btn btn-contorno botones" id="btnLimpiar" title="Limpiar">
                                <i class="fas fa-eraser"></i>
                            </button>
                            <button type="submit" class="btn btn-marca flex-fill botones" id="btnGenerar">
                                <i class="fas fa-chart-column me-2"></i>Generar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div id="loading" class="text-center my-4" style="display: none;">
            <div class="spinner-border" style="color:var(--cafe)" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-2 leyenda">Generando reporte...</p>
        </div>

        <div id="resultados" class="tarjeta report-results" style="display: none;">
            <div class="tarjeta-cabecera">
                <h2>Resultados</h2>
                <button id="btnExportar" class="btn btn-sm btn-marca">
                    <i class="fas fa-file-export me-2"></i>Exportar
                </button>
            </div>
            <div class="table-responsive">
                <table class="tabla" id="tablaResultados">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Usuario</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Cantidad</th>
                            <th class="text-end">Precio unitario</th>
                            <th class="text-end">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- se llena con reporte_venta.js -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script th:src="@{/js/reporte_venta.js}"></script>
</body>
</html>
