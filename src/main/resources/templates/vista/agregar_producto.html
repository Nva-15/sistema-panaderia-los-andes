<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo producto · Panadería Los Andes</title>
    <th:block th:replace="~{componentes/head :: recursos}"></th:block>
</head>
<body>
    <div th:replace="~{componentes/header :: miCabecera}"></div>

    <main class="contenido">
        <div class="encabezado">
            <div>
                <h1>Nuevo producto</h1>
                <p>Registra un pan, torta o pastel con su precio y stock inicial</p>
            </div>
            <a th:href="@{/principal/productos}" class="btn btn-contorno"><i class="fas fa-arrow-left me-2"></i>Volver a productos</a>
        </div>

        <div class="tarjeta" style="max-width:720px">
            <div class="tarjeta-cuerpo">
                <form th:action="@{/productos/guardar}" method="post" enctype="multipart/form-data">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="categoria_id">Categoría</label>
                            <select class="form-select" id="categoria_id" name="categoria_id">
                                <option value="1">Panes</option>
                                <option value="2">Tortas</option>
                                <option value="3">Pasteles</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="nombre">Nombre</label>
                            <input type="text" class="form-control" id="nombre" name="nombre"
                                placeholder="Ej. Pan de yema" autocomplete="off" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="cantidad">Stock inicial</label>
                            <input type="number" class="form-control" id="cantidad" name="cantidad"
                                placeholder="0" min="0" required autocomplete="off">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="precio">Precio (S/)</label>
                            <input type="number" class="form-control" step="any" min="0" id="precio" name="precio"
                                placeholder="0.00" autocomplete="off" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="unidad">Unidad</label>
                            <input type="text" class="form-control" id="unidad" name="unidad"
                                placeholder="Ej. unidad, docena" autocomplete="off" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/principal/productos}" class="btn btn-contorno">Cancelar</a>
                        <button type="submit" class="btn btn-marca"><i class="fas fa-check me-2"></i>Guardar producto</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
