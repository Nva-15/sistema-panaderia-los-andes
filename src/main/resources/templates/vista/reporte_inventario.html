<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario · Panadería Los Andes</title>
    <th:block th:replace="~{componentes/head :: recursos}"></th:block>
</head>

<body>
    <div th:replace="~{componentes/header :: miCabecera}"></div>

    <main class="contenido">
        <div class="encabezado">
            <div>
                <h1>Reporte de inventario</h1>
                <p>Stock de cada producto, activa o desactiva productos y corrige el stock</p>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <button id="btnExportarPDF" class="btn btn-contorno">
                    <i class="fas fa-file-pdf me-2"></i>Exportar PDF
                </button>
                <a th:href="@{/api/reportes/productos/excel}" class="btn btn-marca">
                    <i class="fas fa-file-excel me-2"></i>Excel
                </a>
            </div>
        </div>

        <div class="tarjeta">
            <div class="tarjeta-cuerpo">
                <!-- cada boton envia filtro=<valor> a /productos/filtros -->
                <form th:action="@{/productos/filtros}" method="post" class="segmentos flex-wrap">
                    <button type="submit" name="filtro" value="todos" th:classappend="${filtro == 'todos'} ? 'activo'">
                        <i class="fa-solid fa-globe me-1"></i>Todos</button>
                    <button type="submit" name="filtro" value="disponibles" th:classappend="${filtro == 'disponibles'} ? 'activo'">
                        <i class="fas fa-check-circle me-1"></i>Disponibles</button>
                    <button type="submit" name="filtro" value="agotado" th:classappend="${filtro == 'agotado'} ? 'activo'">
                        <i class="fas fa-times-circle me-1"></i>Agotados</button>
                    <button type="submit" name="filtro" value="stock_bajo" th:classappend="${filtro == 'stock_bajo'} ? 'activo'">
                        <i class="fas fa-exclamation-circle me-1"></i>Stock bajo</button>
                    <button type="submit" name="filtro" value="inactivo" th:classappend="${filtro == 'inactivo'} ? 'activo'">
                        <i class="fas fa-ban me-1"></i>Inactivos</button>
                </form>
            </div>

            <div class="table-responsive">
                <!-- el orden de columnas lo usa reporte_inventario.js para el PDF -->
                <table class="tabla">
                    <thead>
                        <tr>
                            <th>N°</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Stock</th>
                            <th>Condición</th>
                            <th>Estado</th>
                            <th>F.Consulta</th>
                            <th class="text-center">Editar</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="producto,c : ${productos}"
                            th:attr="data-estado=${producto.estado.toLowerCase().replace(' ', '-')}">
                            <td class="leyenda" th:text="${c.count}"></td>
                            <td><strong th:text="${producto.nombre}"></strong></td>
                            <td th:text="${producto.categoria_id.nombre}"></td>
                            <td th:text="${producto.cantidad}"></td>
                            <td>
                                <span th:if="${producto.estado != 'activo'}" class="estado e-neutro">No disponible</span>
                                <span th:if="${producto.estado == 'activo' and producto.cantidad <= 0}" class="estado e-peligro">Agotado</span>
                                <span th:if="${producto.estado == 'activo' and producto.cantidad > 0 and producto.cantidad <= 10}" class="estado e-aviso">Stock bajo</span>
                                <span th:if="${producto.estado == 'activo' and producto.cantidad > 10}" class="estado e-exito">Disponible</span>
                            </td>
                            <td>
                                <form th:action="@{/productos/cambiar_estado}" method="post" class="d-inline">
                                    <input type="hidden" name="id" th:value="${producto.id}" />
                                    <input type="text" hidden th:value="${filtro}" name="filtro">
                                    <div class="form-check form-switch mb-0">
                                        <input class="form-check-input" type="checkbox" role="switch"
                                            th:checked="${producto.estado == 'activo'}" th:id="|estadoSwitch-${producto.id}|"
                                            onchange="cambiarEstado(this)" />
                                        <label class="form-check-label small fw-bold" th:for="|estadoSwitch-${producto.id}|">
                                            <span th:text="${producto.estado == 'activo' ? 'Activo' : 'Inactivo'}"
                                                th:class="${producto.estado == 'activo' ? 'text-success' : 'text-danger'}"></span>
                                        </label>
                                    </div>
                                </form>
                            </td>
                            <td class="leyenda" th:text="${#temporals.format(fechaActualizacion, 'dd/MM/yyyy')}"></td>
                            <td class="text-center">
                                <a type="button" data-bs-toggle="modal" data-bs-target="#exampleModal"
                                    class="btn btn-icono botonEditar" th:data-id="${producto.id}" title="Editar">
                                    <i class="fas fa-pen"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productos)}" class="text-center">
                            <td colspan="8"><div class="vacio"><i class="fas fa-boxes-stacked"></i>Elige un filtro para ver los productos</div></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="pie-tabla" th:unless="${#lists.isEmpty(productos)}">
                <span th:text="${#lists.size(productos) + ' productos'}"></span>
                <span th:text="${'Consultado el ' + #temporals.format(fechaActualizacion, 'dd/MM/yyyy')}"></span>
            </div>
        </div>
    </main>

    <!-- modal para editar el producto (actualizar_producto.js) -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="exampleModalLabel">Actualizar producto</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label" for="nombreEditar">Nombre del producto</label>
                            <input type="text" class="form-control" id="nombreEditar"
                                name="nombre" placeholder="Nombre completo del producto" autocomplete="off" required>
                        </div>
                        <div class="mb-1">
                            <label class="form-label" for="stockEditar">Stock</label>
                            <input type="number" class="form-control" id="stockEditar"
                                name="cantidad" placeholder="Stock actual" autocomplete="off" required>
                        </div>
                    </form>
                    <p th:if="${error}" th:text="${error}" class="alerta-marca error mb-0 mt-3"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-contorno" data-bs-dismiss="modal">Cancelar</button>
                    <button id="btnGuardar" type="button" class="btn btn-marca">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function cambiarEstado(checkbox) {
            // agrega un campo oculto con el nuevo estado y envia el formulario
            const form = checkbox.form;
            const estadoInput = document.createElement('input');
            estadoInput.type = 'hidden';
            estadoInput.name = 'nuevoEstado';
            estadoInput.value = checkbox.checked ? 'activo' : 'inactivo';
            form.appendChild(estadoInput);
            form.submit();
        }
    </script>
    <script th:src="@{/js/actualizar_producto.js}"></script>
    <script th:src="@{/js/reporte_inventario.js}"></script>
</body>

</html>
