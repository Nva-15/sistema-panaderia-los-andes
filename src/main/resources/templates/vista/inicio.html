<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panadería Los Andes</title>
    <th:block th:replace="~{componentes/head :: recursos}"></th:block>
    <style>
        .portada { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center; color: #fff;
            background: linear-gradient(rgba(59,37,18,.72), rgba(59,37,18,.82)), url('/imagenes/panaderia-fondo.jpg') center/cover; }
        .portada img { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; border: 4px solid var(--trigo); margin-bottom: 18px; }
        .portada h1 { font-weight: 900; font-size: clamp(2rem, 6vw, 3.4rem); }
        .portada p { color: var(--beige); max-width: 520px; margin: 0 auto 26px; }
    </style>
</head>
<body>
    <div class="portada">
        <div>
            <img th:src="@{/imagenes/logo-de-la-panaderia.png}" alt="Panadería Los Andes">
            <h1>Panadería Pastelería Los Andes</h1>
            <p>Sistema de gestión de ventas, inventario y tienda. Inicia sesión para acceder al panel.</p>
            <div class="d-flex gap-2 justify-content-center flex-wrap">
                <a th:href="@{/login}" class="btn btn-trigo btn-lg px-4"><i class="fas fa-right-to-bracket me-2"></i>Iniciar sesión</a>
                <a th:href="@{/catalogo}" class="btn btn-outline-light btn-lg px-4"><i class="fas fa-cube me-2"></i>Ver catálogo 3D</a>
            </div>
        </div>
    </div>
</body>
</html>
