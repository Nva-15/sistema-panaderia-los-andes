<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar cliente · Panadería Los Andes</title>
    <th:block th:replace="~{componentes/head :: recursos}"></th:block>
</head>
<body>
    <div th:replace="~{componentes/header :: miCabecera}"></div>

    <main class="contenido">
        <div class="encabezado">
            <div>
                <h1>Registrar cliente</h1>
                <p>Los clientes registrados se encuentran luego por su DNI al vender</p>
            </div>
        </div>

        <div class="tarjeta" style="max-width:720px">
            <div class="tarjeta-cuerpo">
                <div th:if="${param.exito}" class="alerta-marca exito mb-3"><i class="fas fa-circle-check me-2"></i>Cliente guardado correctamente.</div>

                <form th:action="@{/principal/guardarcliente}" th:object="${cliente}" method="post">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label" for="nombre">Nombre completo</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="dni">DNI</label>
                            <input type="text" class="form-control" th:field="*{dni}" maxlength="8" placeholder="8 dígitos" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="correo">Correo electrónico</label>
                            <input type="email" class="form-control" th:field="*{correo}" placeholder="ejemplo@gmail.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="telefono">Teléfono</label>
                            <input type="text" class="form-control" th:field="*{telefono}" placeholder="9 dígitos" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="direccion">Dirección</label>
                            <input type="text" class="form-control" th:field="*{direccion}" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/principal/inicio}" class="btn btn-contorno">Cancelar</a>
                        <button type="submit" class="btn btn-marca"><i class="fas fa-check me-2"></i>Guardar cliente</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
