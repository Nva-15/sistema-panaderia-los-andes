<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Panadería Los Andes</title>
    <th:block th:replace="~{componentes/head :: recursos}"></th:block>
    <style>
        .logo-login { width: 96px; height: 96px; object-fit: cover; border-radius: 50%; border: 3px solid var(--trigo); display: block; margin: 0 auto 12px; }
        #toggleIcon { cursor: pointer; }
    </style>
</head>
<body>
    <div class="pantalla-simple">
        <div class="tarjeta">
            <div class="tarjeta-cuerpo p-4">
                <img class="logo-login" th:src="@{/imagenes/logo-de-la-panaderia.png}" alt="Panadería Los Andes">
                <h1 class="h4 text-center fw-bold mb-1" style="color:var(--cafe-oscuro)">Panadería Los Andes</h1>
                <p class="text-center leyenda mb-4">Inicia sesión para continuar</p>

                <div th:if="${param.error}" class="alerta-marca error mb-3"><i class="fas fa-circle-exclamation me-2"></i>Usuario o contraseña incorrectos.</div>
                <div th:if="${param.logout}" class="alerta-marca exito mb-3"><i class="fas fa-circle-check me-2"></i>Cerraste sesión correctamente.</div>
                <p th:if="${error}" th:text="${error}" class="alerta-marca error mb-3"></p>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="username">Usuario</label>
                        <div class="buscador">
                            <i class="fas fa-user"></i>
                            <input type="text" id="username" name="username" class="form-control" autocomplete="username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">Contraseña</label>
                        <div class="input-group">
                            <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
                            <span class="input-group-text bg-white toggle-password" title="Mostrar u ocultar">
                                <i class="fas fa-eye" id="toggleIcon"></i>
                            </span>
                        </div>
                    </div>
                    <button id="btn-ingresar" type="submit" class="btn btn-marca w-100 py-2"><i class="fas fa-right-to-bracket me-2"></i>Ingresar</button>
                    <a th:href="@{/principal}" class="btn btn-contorno w-100 mt-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('toggleIcon').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const mostrar = passwordInput.type === 'password';
            passwordInput.type = mostrar ? 'text' : 'password';
            this.classList.toggle('fa-eye', !mostrar);
            this.classList.toggle('fa-eye-slash', mostrar);
        });
    </script>
</body>
</html>
