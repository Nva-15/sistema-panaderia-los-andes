<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo IoT · Panadería Los Andes</title>
    <th:block th:replace="~{componentes/head :: recursos}"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/iot.css}">
</head>

<body>
    <div th:replace="~{componentes/header :: miCabecera}"></div>

    <main class="contenido">
        <div class="encabezado">
            <div>
                <h1><i class="fas fa-microchip me-2 icono-iot"></i>Monitoreo IoT</h1>
                <p>Vitrina, bandeja de pan, puerta del almacén y clientes · ESP32 vía MQTT</p>
            </div>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <span id="estadoMqtt" class="badge bg-secondary">MQTT</span>
                <span id="estadoDispositivo" class="badge bg-secondary">Sin datos</span>
                <select id="horas" class="form-select form-select-sm w-auto">
                    <option value="1">Última hora</option>
                    <option value="6" selected>Últimas 6 horas</option>
                    <option value="24">Últimas 24 horas</option>
                </select>
            </div>
        </div>
        <p class="leyenda mb-3">Última lectura: <span id="ultimaLectura">—</span> · se actualiza cada 10 segundos</p>

        <!-- tarjetas con el ultimo valor de cada sensor -->
        <div id="tarjetas" class="row g-3 mb-4"></div>

        <!-- graficos -->
        <div id="graficos" class="row g-3 mb-4"></div>

        <div class="tarjeta overflow-hidden">
            <div class="tarjeta-cabecera">
                <h2><i class="fas fa-bell me-2"></i>Alertas recientes</h2>
                <span id="contadorAlertas" class="badge bg-success">0 pendientes</span>
            </div>
            <div class="table-responsive">
                <table class="tabla">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Prioridad</th>
                            <th>Alerta</th>
                            <th class="text-end">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaAlertas">
                        <tr>
                            <td colspan="4" class="text-center text-muted py-3">Sin alertas</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script th:src="@{/js/iot.js}"></script>
</body>

</html>
