<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.:: Monitoreo IoT ::.</title>
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css}" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js}"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/iot.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div th:replace="~{componentes/header :: miCabecera}"></div>

    <div class="container py-4">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
            <div class="d-flex align-items-center">
                <i class="fas fa-microchip fa-2x me-3 icono-iot"></i>
                <div>
                    <h1 class="h3 mb-0">Monitoreo IoT de la panadería</h1>
                    <small class="text-muted">Vitrina, bandeja de pan, puerta del almacén y clientes · ESP32 vía MQTT</small>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span id="estadoMqtt" class="badge bg-secondary">MQTT</span>
                <span id="estadoDispositivo" class="badge bg-secondary">Sin datos</span>
                <select id="horas" class="form-select form-select-sm w-auto">
                    <option value="1">Última hora</option>
                    <option value="6" selected>Últimas 6 horas</option>
                    <option value="24">Últimas 24 horas</option>
                </select>
            </div>
        </div>
        <p class="small text-muted mb-3">Última lectura: <span id="ultimaLectura">—</span> · se actualiza cada 10 segundos</p>

        <!-- tarjetas con el ultimo valor de cada sensor -->
        <div id="tarjetas" class="row g-3 mb-4"></div>

        <!-- graficos -->
        <div id="graficos" class="row g-3 mb-4"></div>

        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-bell me-2"></i>Alertas recientes</span>
                <span id="contadorAlertas" class="badge bg-success">0 pendientes</span>
            </div>
            <div class="table-responsive">
                <table class="table table-sm mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Fecha</th>
                            <th>Prioridad</th>
                            <th>Alerta</th>
                            <th class="text-end">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaAlertas">
                        <tr>
                            <td colspan="4" class="text-center text-muted py-3">Sin alertas</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script th:src="@{/js/iot.js}"></script>
</body>

</html>
