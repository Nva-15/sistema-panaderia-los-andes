<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva venta · Panadería Los Andes</title>
    <th:block th:replace="~{componentes/head :: recursos}"></th:block>
    <style>
        #detallesVenta .btn { padding: .2rem .45rem; margin: 0 1px; }
        .total-venta { font-size: 1.4rem; font-weight: 800; color: var(--cafe-oscuro); }
    </style>
</head>
<body>
    <div th:replace="~{componentes/header :: miCabecera}"></div>

    <main class="contenido">
        <div class="encabezado">
            <div>
                <h1>Nueva venta</h1>
                <p>Agrega los productos, busca al cliente por su DNI y registra la venta</p>
            </div>
        </div>

        <div class="row g-3">
            <!-- productos -->
            <div class="col-12 col-xl-8">
                <div class="tarjeta h-100">
                    <div class="tarjeta-cabecera"><h2><i class="fas fa-basket-shopping me-2"></i>Productos de la venta</h2></div>
                    <div class="tarjeta-cuerpo">
                        <div class="row g-3 align-items-end">
                            <div class="col-12 col-md-6">
                                <label for="categoria" class="form-label">Categoría</label>
                                <select id="categoria" class="form-select" required>
                                    <option value="">-- Seleccione --</option>
                                    <option th:each="categoria : ${categoria}"
                                            th:value="${categoria.id}"
                                            th:text="${categoria.nombre}"></option>
                                </select>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="producto" class="form-label">Producto</label>
                                <select id="producto" class="form-select" required>
                                    <option value="">-- Seleccione --</option>
                                </select>
                            </div>
                            <div class="col-6 col-md-4">
                                <label for="precio" class="form-label">Precio (S/)</label>
                                <input type="number" id="precio" class="form-control" readonly>
                            </div>
                            <div class="col-6 col-md-4">
                                <label for="cantidad" class="form-label">Cantidad</label>
                                <input type="number" id="cantidad" class="form-control" min="1" value="1">
                            </div>
                            <div class="col-12 col-md-4">
                                <button id="agregarProducto" class="btn btn-trigo w-100">
                                    <i class="fas fa-plus me-2"></i>Agregar
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table id="productosTable" class="tabla">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th class="text-end">Precio</th>
                                    <th class="text-center">Cantidad</th>
                                    <th class="text-end">Subtotal</th>
                                    <th class="text-center">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="detallesVenta">
                                <!-- filas dinamicas (venta.js) -->
                            </tbody>
                            <tfoot>
                                <tr>
                                    <th colspan="3" class="text-end">Total</th>
                                    <th id="totalVenta" class="text-end total-venta">S/ 0.00</th>
                                    <th></th>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>

            <!-- cliente -->
            <div class="col-12 col-xl-4">
                <div class="tarjeta h-100">
                    <div class="tarjeta-cabecera"><h2><i class="fas fa-user me-2"></i>Datos del cliente</h2></div>
                    <div class="tarjeta-cuerpo">
                        <form id="clienteForm">
                            <div class="mb-3">
                                <label for="dni" class="form-label">DNI</label>
                                <div class="input-group">
                                    <input type="text" id="dni" name="dni" class="form-control" maxlength="8"
                                        pattern="\d{8}" title="Debe contener 8 dígitos"
                                        value="" placeholder="8 dígitos" required>
                                    <button class="btn btn-contorno" id="buscarCliente" type="button">
                                        <i class="fas fa-search me-1"></i>Buscar
                                    </button>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="nombreCliente" class="form-label">Nombre</label>
                                <input type="text" id="nombreCliente" name="nombre" class="form-control" value="" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 col-xl-12 col-xxl-6 mb-3">
                                    <label for="celular" class="form-label">Celular</label>
                                    <input type="text" id="celular" class="form-control" maxlength="9"
                                        pattern="\d{9}" title="Debe contener 9 dígitos" value="" name="celular" placeholder="9 dígitos" required>
                                </div>
                                <div class="col-md-6 col-xl-12 col-xxl-6 mb-3">
                                    <label for="correo" class="form-label">Correo</label>
                                    <input type="email" id="correo" class="form-control" value="" name="correo" placeholder="ejemplo@gmail.com" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="direccion" class="form-label">Dirección</label>
                                <input type="text" id="direccion" class="form-control" value="" name="direccion" required>
                            </div>

                            <div class="d-flex gap-2">
                                <button id="cancelarVenta" class="btn btn-contorno flex-fill" type="button">
                                    <i class="fas fa-times me-1"></i>Cancelar
                                </button>
                                <button id="procesarVenta" class="btn btn-marca flex-fill" type="button">
                                    <i class="fas fa-check me-1"></i>Registrar venta
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script th:src="@{/js/venta.js}"></script>
</body>
</html>
