# Configuracion para las pruebas automaticas: base de datos H2 en memoria con modo MySQL
spring.datasource.url=jdbc:h2:mem:panaderia;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
app.admin.username=admin
app.admin.password=Admin123!
app.iot.api-key=clave-iot-pruebas
app.iot.mqtt.habilitado=false
app.iot.segundos-entre-guardados=0
server.forward-headers-strategy=framework
