# Tareas programadas de la panaderia (Avance 4)
# GitHub Actions llama al sistema en Render a la hora indicada; el sistema arma el mensaje y lo envia a Make.
# Como el plan gratuito de Render apaga el servidor sin visitas, se reintenta mientras despierta (1-3 minutos).
#
# Requiere en GitHub (Settings > Secrets and variables > Actions):
#   - Secret   AUTOMATIZACION_API_KEY : la misma clave configurada en Render
#   - Variable APP_URL (opcional)     : por defecto https://sistema-panaderia-los-andes.onrender.com
name: Automatizaciones

on:
  schedule:
    - cron: "0 0 * * *"   # 19:00 hora de Lima (00:00 UTC) -> agente IA: plan de produccion
    - cron: "0 2 * * *"   # 21:00 hora de Lima (02:00 UTC) -> reporte de cierre diario
  workflow_dispatch:
    inputs:
      automatizacion:
        description: "Automatizacion a ejecutar"
        required: true
        type: choice
        options:
          - cierre_diario
          - plan_produccion

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.AUTOMATIZACION_API_KEY }}
      APP_URL: ${{ vars.APP_URL || 'https://sistema-panaderia-los-andes.onrender.com' }}
    steps:
      - name: Elegir la automatizacion
        id: elegir
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tipo=${{ inputs.automatizacion }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
            echo "tipo=plan_produccion" >> "$GITHUB_OUTPUT"
          else
            echo "tipo=cierre_diario" >> "$GITHUB_OUTPUT"
          fi

      - name: Aviso si falta la clave
        if: env.API_KEY == ''
        run: echo "::warning::Falta el secreto AUTOMATIZACION_API_KEY; no se ejecuto la automatizacion."

      - name: Despertar el servidor y ejecutar
        if: env.API_KEY != ''
        run: |
          echo "Ejecutando ${{ steps.elegir.outputs.tipo }} en $APP_URL"
          curl -sS --fail-with-body --retry 8 --retry-delay 20 --retry-all-errors --max-time 180 \
            -X POST "$APP_URL/api/automatizaciones/${{ steps.elegir.outputs.tipo }}/ejecutar" \
            -H "X-API-KEY: $API_KEY"
