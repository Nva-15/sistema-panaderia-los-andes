# Pipeline CI/CD - Panaderia Los Andes
#  1. Integracion continua: compila y ejecuta las pruebas en cada push y pull request
#  2. Construye la imagen Docker
#  3. Despliegue continuo: si todo pasa en la rama main, publica en Render
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B verify

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: target/surefire-reports/

      - name: Guardar el .jar generado
        uses: actions/upload-artifact@v4
        with:
          name: panaderia-jar
          path: target/*.jar

  docker:
    name: Construir imagen Docker
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t panaderia-los-andes:${{ github.sha }} .

  deploy:
    name: Desplegar en Render
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Disparar despliegue
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Aviso si falta configurar Render
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "::warning::Falta el secreto RENDER_DEPLOY_HOOK_URL; no se desplego."
